<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Athira Studio – Đăng nhập TikTok</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#141c3a;color:#fff;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .box{max-width:520px;background:#1f2a52;border-radius:14px;padding:28px;text-align:center}
  h1{font-size:20px;margin:0 0 12px;color:#ffc400}
  p{line-height:1.6;margin:8px 0}
  a{color:#ffc400}
</style>
</head>
<body>
<div class="box">
  <h1>Athira Studio</h1>
  <p id="msg">Đang chuyển về công cụ trên máy… / Returning to the local tool…</p>
</div>
<script>
// Forward only code/state/error to the fixed local tool address. Nothing is stored or sent elsewhere.
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "scopes", "error", "error_description"].forEach(function (k) {
    if (q.get(k)) out.set(k, q.get(k));
  });
  var msg = document.getElementById("msg");
  if (!out.toString()) { msg.textContent = "Trang này chỉ dùng khi đăng nhập TikTok từ công cụ Athira Studio."; return; }
  history.replaceState(null, "", location.pathname);
  var dich = "http://localhost:8765/callback/?" + out.toString();
  msg.innerHTML = 'Nếu không tự chuyển, bấm <a id="l">vào đây</a>. Công cụ trên máy phải đang chạy.';
  document.getElementById("l").href = dich;
  location.replace(dich);
})();
</script>
</body>
</html>
